# flash.img — immagine raw della SPI NAND con le partizioni ai loro offset.
#
# NON e' l'artefatto primario: per programmare la board si usa update.img
# (rkdeveloptool uf), oppure le singole immagini per partizione.
# Questa serve a due cose concrete:
#   - ispezionare il layout senza una board ("cosa finisce dove");
#   - alimentare un programmatore NAND esterno.
#
# QUESTO FILE E' UN TEMPLATE: gli offset non si scrivono a mano.
# Le partizioni portano il segnaposto @OFFSET_<nome>@, e post-image.sh
# (sezione 6) lo sostituisce con i byte che flash_layout legge da
# board/lyra-plus/parameter.txt, scrivendo la copia risolta in
# output/build/lyra-plus-image/genimage.cfg. parameter.txt e' la fonte unica
# del layout, e questo file non ne tiene una seconda copia. Un segnaposto che
# resta non risolto uccide la build, e vuol dire che quel nome non e' piu' in
# parameter.txt.
#
# Oggi parameter.txt da' (settori da 512 B -> byte), a titolo di riferimento:
#     uboot   0x02000 sett =  4 MiB   (size 0x2000 sett =  4 MiB)
#     boot    0x04000 sett =  8 MiB   (size 0x6000 sett = 12 MiB)
#     rootfs  0x10000 sett = 32 MiB   (size "grow")
# Fra 20 MiB (fine di boot) e 32 MiB resta un buco non allocato: e' cosi'
# anche nel parameter.txt vendor, non e' un errore di trascrizione.
#
# DUE COSE CHE QUESTA IMMAGINE NON FA, DI PROPOSITO
#
# 1. Non e' avviabile. I primi 4 MiB — l'area riservata a loader/IDB —
#    restano vuoti, perche' l'offset a cui il BootROM RK3506 cerca l'IDB su
#    SPI NAND non e' stato accertato (docs/BOARD-FACTS.md, TODO-4). Quando
#    TODO-4 sara' chiuso bastera' aggiungere qui una partition per
#    MiniLoaderAll.bin all'offset giusto.
#
# 2. Non e' paddata alla dimensione del chip. Il file finisce subito dopo
#    l'ultima partizione, quindi e' grande quanto serve e non 256 MiB.
#    Non e' una limitazione di genimage da aggirare: e' voluto. La
#    dimensione reale della NAND e' ancora TODO-5 (non verificata su
#    hardware), e paddare a 256 MiB significherebbe scrivere nel file un
#    dato che non abbiamo confermato. Un programmatore NAND riempie da se'
#    lo spazio residuo.
#
#    Per la stessa ragione le partizioni non dichiarano 'size': gli offset
#    arrivano da parameter.txt per sostituzione (vedi sopra) e le dimensioni
#    massime le ha gia' controllate post-image.sh prima di arrivare qui.

image flash.img {
	hdimage {
		# Nessuna tabella delle partizioni sul chip: le partizioni MTD
		# sono dichiarate dal bootargs (mtdparts=), non da una GPT.
		partition-table-type = "none"
	}

	partition uboot {
		in-partition-table = false
		image = "uboot.img"
		offset = @OFFSET_uboot@
	}

	partition boot {
		in-partition-table = false
		image = "boot.img"
		offset = @OFFSET_boot@
	}

	partition rootfs {
		in-partition-table = false
		image = "rootfs.img"
		offset = @OFFSET_rootfs@
	}
}
